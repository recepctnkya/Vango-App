workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:assembleDebug -x syncHexnetVersion
    artifacts:
      - composeApp/build/outputs/apk/debug/*.apk

  ios-simulator:
    name: iOS Simulator app
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Make Gradle wrapper executable
        script: chmod +x ./gradlew
      - name: Provide KMQTT iOS Simulator OpenSSL library
        script: |
          KLIB="composeApp/build/kmqtt-native/openssl-ios-simulator-arm64.klib"
          mkdir -p "$(dirname "$KLIB")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/davidepianca98/KMQTT/1.0.0/kmqtt-common/src/nativeInterop/openssl-ios-simulator-arm64.klib" \
            --output "$KLIB"
          echo "717562a7effddc13a68da13bad2341d72604ab9e717c9fe23ec0848d1295c2d7  $KLIB" | shasum -a 256 --check
      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package iOS Simulator app
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/VanGO.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected iOS Simulator app not found: $APP_PATH" >&2
            exit 1
          fi
          mkdir -p build/ios
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/ios/VanGO-iOS-Simulator.zip
    artifacts:
      - build/ios/VanGO-iOS-Simulator.zip

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hexnet Vango
    environment:
      xcode: latest
      java: 17
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hexnet.vango
    scripts:
      - name: Make Gradle wrapper executable
        script: chmod +x ./gradlew
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: xcode-project build-ipa --project iosApp/iosApp.xcodeproj --scheme iosApp
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
